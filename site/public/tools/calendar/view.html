<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>日历</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='6' width='24' height='22' rx='5' fill='none' stroke='%230e8496' stroke-width='2.4'/%3E%3Cpath d='M4 13h24M10 4v5M22 4v5' fill='none' stroke='%230e8496' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <script>
    /* 主题：与站点开关共用 theme-preference（light / dark / system），未设置时跟随系统 */
    (function () {
      var KEY = "theme-preference";
      function isDark() {
        var stored = null;
        try { stored = localStorage.getItem(KEY); } catch (e) {}
        if (stored === "dark") return true;
        if (stored === "light") return false;
        try {
          return window.matchMedia("(prefers-color-scheme: dark)").matches;
        } catch (e) {
          return false;
        }
      }
      function apply() {
        document.documentElement.classList.toggle("dark", isDark());
      }
      apply();
      window.addEventListener("storage", function (event) {
        if (event.key === KEY) apply();
      });
      try {
        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", apply);
      } catch (e) {}
    })();
  </script>
<style>
  :root {
    color-scheme: light;
    --page-bg: #f4f5f7;
    --surface: #ffffff;
    --surface-2: #f3f4f6;
    --border: #e3e5e9;
    --border-soft: #eef0f2;
    --ink: #1c2026;
    --muted: #6b7280;
    --faint: #9aa1ab;
    --accent: #0e8496;
    --accent-ink: #0a6b79;
    --accent-soft: #e6f4f6;
    --holiday: #c2544a;
    --holiday-soft: #fbeeed;
    --term: #12936f;
    --term-soft: #e9f6f2;
    --shadow: 0 20px 48px -34px rgba(17, 24, 39, .45);
  }
  .dark {
    color-scheme: dark;
    --page-bg: #101114;
    --surface: #191b1f;
    --surface-2: #22252a;
    --border: #2d3137;
    --border-soft: #24272c;
    --ink: #eceef2;
    --muted: #9aa1ac;
    --faint: #6f7782;
    --accent: #43c6db;
    --accent-ink: #7ddcec;
    --accent-soft: #15333a;
    --holiday: #e88f86;
    --holiday-soft: #35211f;
    --term: #4cc79b;
    --term-soft: #16302a;
    --shadow: 0 24px 58px -32px rgba(0, 0, 0, .9);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    padding: clamp(12px, 2vh, 22px) 18px 34px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: var(--page-bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .page { width: 100%; max-width: 760px; }

  .head { margin: 0 0 14px; text-align: center; }
  .title { margin: 0; font-size: 20px; line-height: 28px; font-weight: 500; }
  .subtitle { margin: 2px 0 0; font-size: 12px; line-height: 18px; color: var(--muted); }

  button { font: inherit; color: inherit; }
  button:focus-visible {
    outline: 2px solid color-mix(in srgb, var(--accent) 60%, transparent);
    outline-offset: 2px;
  }

  .panel {
    padding: 14px 16px 16px;
    border: 1px solid var(--border);
    border-radius: 22px;
    background: var(--surface);
    box-shadow: var(--shadow);
  }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .seg {
    display: inline-flex;
    padding: 3px;
    border-radius: 12px;
    background: var(--surface-2);
  }
  .seg button {
    padding: 0 14px;
    height: 30px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
  }
  .seg button.is-on {
    background: var(--surface);
    color: var(--ink);
    box-shadow: 0 1px 3px rgba(15, 23, 42, .12);
  }

  .nav { display: flex; align-items: center; gap: 6px; }
  .icon-btn, .today-btn {
    height: 30px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
  }
  .icon-btn { width: 32px; font-size: 16px; line-height: 1; }
  .today-btn { padding: 0 11px; font-size: 12.5px; }
  .icon-btn:hover, .today-btn:hover { background: var(--surface-2); }

  .period {
    display: flex;
    align-items: baseline;
    gap: 9px;
    margin: 14px 2px 10px;
    flex-wrap: wrap;
  }
  .period h2 {
    margin: 0;
    font-size: 18px;
    line-height: 26px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  /* 年视图标题可点开年份弹层，但外观与普通标题一致，只保留手型光标 */
  .period h2.is-pick { cursor: pointer; }
  .pill {
    padding: 1px 8px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--muted);
    font-size: 11px;
    line-height: 18px;
    white-space: nowrap;
  }

  /* ---- 周视图 ---- */
  .week-list { border-top: 1px solid var(--border-soft); }
  .week-row {
    display: grid;
    grid-template-columns: 48px 46px minmax(0, 1fr) auto;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 9px 8px;
    border: 0;
    border-bottom: 1px solid var(--border-soft);
    background: transparent;
    text-align: left;
    cursor: pointer;
    border-radius: 8px;
  }
  .week-row:hover { background: var(--surface-2); }
  .week-row.is-today { background: var(--accent-soft); }
  .week-row.is-selected { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .w-name { font-size: 12px; color: var(--muted); }
  .w-num {
    font-size: 22px;
    line-height: 26px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .week-row.is-today .w-num { color: var(--accent-ink); }
  .w-lunar {
    min-width: 0;
    font-size: 12.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .w-flag { font-size: 11.5px; color: var(--muted); }

  .badge {
    display: inline-block;
    padding: 0 5px;
    border-radius: 5px;
    font-size: 10.5px;
    line-height: 16px;
    vertical-align: 1px;
    white-space: nowrap;
  }
  .badge.off { background: var(--holiday-soft); color: var(--holiday); }
  .badge.work { background: var(--surface-2); color: var(--faint); }

  /* ---- 月视图 ---- */
  .weekdays, .month-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
  }
  .weekdays {
    padding-bottom: 6px;
    font-size: 11px;
    color: var(--faint);
    text-align: center;
  }
  .month-grid { gap: 3px; }
  .day {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    min-height: 62px;
    padding: 5px 2px 4px;
    border: 1px solid transparent;
    border-radius: 10px;
    background: transparent;
    cursor: pointer;
  }
  .day:hover { background: var(--surface-2); }
  .day.is-out { opacity: .4; }
  .day.is-today { background: var(--accent-soft); }
  .day.is-selected { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .d-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 24px;
    height: 24px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .day.is-today .d-num { background: var(--accent); color: #fff; }
  .d-sub {
    max-width: 100%;
    font-size: 10px;
    line-height: 14px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .d-sub.is-term { color: var(--term); }
  .d-sub.is-fest { color: var(--holiday); }
  .d-badge {
    position: absolute;
    top: 4px;
    right: 4px;
    padding: 0 3px;
    border-radius: 4px;
    font-size: 9px;
    line-height: 13px;
  }
  .d-badge.off { background: var(--holiday-soft); color: var(--holiday); }
  .d-badge.work { background: var(--surface-2); color: var(--faint); }

  /* ---- 年视图 ---- */
  .year-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
  }
  .ymonth {
    padding: 9px 9px 8px;
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    background: var(--surface);
  }
  .ymonth header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 4px;
    margin-bottom: 5px;
    cursor: pointer;
  }
  .ymonth b { font-size: 13px; font-weight: 500; }
  .ymonth header .ytags {
    display: inline-flex;
    align-items: baseline;
    gap: 4px;
    min-width: 0;
    overflow: hidden;
  }
  .ytag-fest {
    flex: none;
    font-style: normal;
    font-size: 9.5px;
    line-height: 14px;
    font-weight: 500;
    color: var(--holiday);
    white-space: nowrap;
  }
  .ytag-dot {
    flex: none;
    font-size: 9px;
    line-height: 14px;
    color: var(--faint);
  }
  .ytag-term {
    min-width: 0;
    font-size: 9.5px;
    line-height: 14px;
    color: var(--term);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mini-head {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    margin: 1px 0 2px;
    font-size: 9px;
    line-height: 12px;
    color: var(--faint);
    text-align: center;
  }
  .mini {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 1px;
  }
  .mini span {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 17px;
    border-radius: 5px;
    font-size: 9.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    cursor: pointer;
  }
  .mini span.is-empty { cursor: default; }
  .mini span:hover:not(.is-empty) { background: var(--surface-2); }
  .mini span.is-today { background: var(--accent); color: #fff; }
  .mini span.is-off { color: var(--holiday); }
  .mini span.is-term { color: var(--term); }

  /* ---- 详情 ---- */
  .detail {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 10px 16px;
    margin-top: 12px;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .detail-date { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .detail-num {
    font-size: 26px;
    line-height: 32px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .detail-week { font-size: 13px; color: var(--muted); }
  .detail-full { margin: 0; font-size: 12px; color: var(--muted); }
  .detail-lunar { margin: 2px 0 0; font-size: 13px; color: var(--ink); }
  .detail-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    justify-content: flex-end;
    align-content: flex-start;
  }
  .chip {
    padding: 1px 8px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--muted);
    font-size: 11px;
    line-height: 18px;
    white-space: nowrap;
  }
  .chip.off { background: var(--holiday-soft); color: var(--holiday); }
  .chip.term { background: var(--term-soft); color: var(--term); }
  .chip.sign i {
    margin-right: 4px;
    font-style: normal;
    font-family: "Apple Symbols", "Segoe UI Symbol", "Noto Sans Symbols 2", sans-serif;
    font-variant-emoji: text;
  }

  /* ---- 节气 / 假日说明 ---- */
  .note {
    margin-top: 10px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--surface);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .note-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    width: 100%;
    padding: 11px 14px;
    border: 0;
    background: transparent;
    text-align: left;
    cursor: pointer;
  }
  .note-head:hover { background: var(--surface-2); }
  .note-kind {
    flex: none;
    padding: 0 6px;
    border-radius: 6px;
    background: var(--term-soft);
    color: var(--term);
    font-size: 10px;
    line-height: 16px;
  }
  .note-kind.is-fest { background: var(--holiday-soft); color: var(--holiday); }
  .note-kind.is-day { background: var(--accent-soft); color: var(--accent-ink); }
  .note-name { font-size: 14px; font-weight: 500; }
  .note-sum {
    flex: 1;
    min-width: 0;
    font-size: 11.5px;
    color: var(--faint);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .note-caret {
    flex: none;
    align-self: center;
    width: 0;
    height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 5px solid var(--faint);
    transition: transform .18s ease;
  }
  .note-head[aria-expanded="true"] .note-caret { transform: rotate(180deg); }
  .note-body {
    padding: 11px 14px 13px;
    border-top: 1px solid var(--border-soft);
  }
  .note-desc {
    margin: 0;
    font-size: 12.5px;
    line-height: 19px;
    color: var(--ink);
  }
  .note-extra {
    margin: 6px 0 0;
    font-size: 11.5px;
    line-height: 18px;
    color: var(--muted);
  }

  .foot {
    margin: 12px 4px 0;
    font-size: 11px;
    line-height: 18px;
    color: var(--faint);
    text-align: center;
  }

  @media (max-width: 700px) {
    .year-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 430px) {
    .year-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    body { padding-left: 10px; padding-right: 10px; }
    .panel { padding: 12px 10px 12px; border-radius: 18px; }
    .day { min-height: 54px; }
    .d-sub { font-size: 9px; }
    .detail { grid-template-columns: 1fr; }
    .detail-meta { justify-content: flex-start; }
    .week-row { grid-template-columns: 42px 40px minmax(0, 1fr) auto; gap: 6px; }
    .w-num { font-size: 20px; }
  }
  .year-hint {
    margin: 9px 2px 0;
    font-size: 11px;
    color: var(--faint);
    text-align: center;
  }

  /* ---- 年份选择 ---- */
  .picker {
    width: min(292px, calc(100vw - 32px));
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--surface);
    color: var(--ink);
    box-shadow: 0 30px 64px -28px rgba(17, 24, 39, .55);
  }
  .picker::backdrop {
    background: rgba(14, 18, 22, .42);
    backdrop-filter: blur(2px);
  }
  .dark .picker { box-shadow: 0 30px 64px -22px rgba(0, 0, 0, .9); }
  .dark .picker::backdrop { background: rgba(0, 0, 0, .62); }
  .picker-inner { padding: 16px 16px 14px; }
  .picker-title {
    margin: 0;
    font-size: 13px;
    line-height: 20px;
    font-weight: 500;
  }
  .picker-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin-top: 10px;
  }
  .picker-row input {
    flex: 1;
    min-width: 0;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-2);
    color: var(--ink);
    font: inherit;
    font-size: 17px;
    line-height: 24px;
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }
  .picker-row input:focus-visible {
    outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
    outline-offset: 1px;
  }
  .picker-unit { font-size: 13px; color: var(--muted); }
  .picker-note {
    margin: 7px 1px 0;
    font-size: 11px;
    line-height: 16px;
    color: var(--faint);
  }
  .picker-note.is-error { color: var(--holiday); }
  .picker-quick {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 11px;
  }
  .picker-quick:empty { display: none; }
  .picker-chip {
    padding: 0 8px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: var(--surface-2);
    color: var(--muted);
    font-size: 11.5px;
    line-height: 22px;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    transition: color .15s ease, background .15s ease, border-color .15s ease;
  }
  .picker-chip:hover { color: var(--ink); border-color: var(--border); }
  .picker-chip.is-on {
    background: var(--accent-soft);
    color: var(--accent-ink);
    border-color: color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .picker-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 14px;
  }
  .picker-btn {
    padding: 0 14px;
    height: 32px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
  }
  .picker-btn:hover { background: var(--surface-2); }
  .picker-btn.is-primary {
    border-color: transparent;
    background: var(--accent);
    color: #fff;
    font-weight: 500;
  }
  .dark .picker-btn.is-primary { color: #0b1417; }
  .picker-btn.is-primary:hover { background: var(--accent-ink); }
  .dark .picker-btn.is-primary:hover { background: var(--accent); filter: brightness(1.08); }
</style>
</head>
<body>
<div class="page">
  <header class="head">
    <h1 class="title">日历</h1>
    <p class="subtitle">公历 · 农历 · 节气 · 节假日</p>
  </header>

  <section class="panel" aria-label="日历">
    <div class="toolbar">
      <div class="seg" id="view-seg" role="group" aria-label="视图切换">
        <button type="button" data-view="week">周</button>
        <button type="button" data-view="month">月</button>
        <button type="button" data-view="year">年</button>
      </div>
      <div class="nav">
        <button type="button" class="icon-btn" id="prev" aria-label="上一页">‹</button>
        <button type="button" class="today-btn" id="today">今天</button>
        <button type="button" class="icon-btn" id="next" aria-label="下一页">›</button>
      </div>
    </div>

    <div class="period">
      <h2 id="period-title" tabindex="-1">2026 年 11 月</h2>
      <span class="pill" id="period-sub">第 47 周</span>
    </div>

    <div id="view-week" hidden>
      <div class="week-list" id="week-list"></div>
    </div>

    <div id="view-month">
      <div class="weekdays" aria-hidden="true">
        <span>一</span><span>二</span><span>三</span><span>四</span>
        <span>五</span><span>六</span><span>日</span>
      </div>
      <div class="month-grid" id="month-grid"></div>
    </div>

    <div id="view-year" hidden>
      <div class="year-grid" id="year-grid"></div>
      <p class="year-hint">点标题年份可直接跳转，点月份进入月视图</p>
    </div>
  </section>

  <dialog class="picker" id="year-picker" aria-labelledby="year-picker-title">
    <form class="picker-inner" id="year-form" method="dialog" novalidate>
      <p class="picker-title" id="year-picker-title">跳转到年份</p>
      <div class="picker-row">
        <input type="number" id="year-input" min="1901" max="2100" step="1"
          inputmode="numeric" autocomplete="off" aria-describedby="year-note">
        <span class="picker-unit">年</span>
      </div>
      <p class="picker-note" id="year-note">范围 1901–2100</p>
      <div class="picker-quick" id="year-quick" role="group" aria-label="常用年份"></div>
      <div class="picker-actions">
        <button type="button" class="picker-btn" id="year-cancel">取消</button>
        <button type="submit" class="picker-btn is-primary">确定</button>
      </div>
    </form>
  </dialog>

  <section class="detail" id="detail" aria-live="polite">
    <div>
      <div class="detail-date">
        <span class="detail-num" id="detail-num">16</span>
        <span class="detail-week" id="detail-week">周一</span>

  // [起始月, 起始日, 名称, 符号]；日期早于本月起始日则属于上一宫
  // 符号后缀 \uFE0E 强制文本呈现，否则 macOS 会渲染成彩色 emoji
  var STAR_SIGNS = [
    [1, 20, '水瓶座', '♒\uFE0E'], [2, 19, '双鱼座', '♓\uFE0E'], [3, 21, '白羊座', '♈\uFE0E'],

  ];

  function starSign(m, d) {
    var i = d < STAR_SIGNS[m - 1][1] ? (m + 10) % 12 : m - 1;
    return STAR_SIGNS[i];
  }

  /* ============ 农历解码 ============ */
  var monthCache = Object.create(null);
  var yearDaysCache = Object.create(null);
  var termCache = Object.create(null);

  function leapMonth(y) { return LUNAR_INFO[y - YEAR_BASE] & 0xf; }
  function leapDays(y) { return leapMonth(y) ? ((LUNAR_INFO[y - YEAR_BASE] & 0x10000) ? 30 : 29) : 0; }
  function monthDays(y, m) { return (LUNAR_INFO[y - YEAR_BASE] & (0x10000 >> m)) ? 30 : 29; }

  function yearDays(y) {
    if (yearDaysCache[y]) return yearDaysCache[y];
    var sum = 348;
    for (var i = 0x8000; i > 0x8; i >>= 1) {
      sum += (LUNAR_INFO[y - YEAR_BASE] & i) ? 1 : 0;
    }
    yearDaysCache[y] = sum + leapDays(y);
    return yearDaysCache[y];
  }

  function lunarMonths(y) {
    if (monthCache[y]) return monthCache[y];
    var leap = leapMonth(y);
    var list = [];
    for (var m = 1; m <= 12; m++) {
      list.push({ month: m, leap: false, days: monthDays(y, m) });
      if (m === leap) list.push({ month: m, leap: true, days: leapDays(y) });
    }
    monthCache[y] = list;
    return list;
  }

  function lunarFromDate(y, m, d) {
    var offset = Math.floor((Date.UTC(y, m - 1, d) - Date.UTC(1900, 0, 31)) / 86400000);
    var ly = 1900;
    while (ly < MAX_YEAR && offset >= yearDays(ly)) {
      offset -= yearDays(ly);
      ly += 1;
    }
    var list = lunarMonths(ly);
    for (var i = 0; i < list.length; i++) {
      if (offset < list[i].days) {
        return {
          year: ly, month: list[i].month, day: offset + 1,
          leap: list[i].leap, daysInMonth: list[i].days
        };
      }
      offset -= list[i].days;
    }
    return null;
  }

  function lunarDayName(d) {
    var n = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
    if (d <= 10) return '初' + n[d - 1];
    if (d < 20) return '十' + n[d - 11];
    if (d === 20) return '二十';
    if (d < 30) return '廿' + n[d - 21];
    return '三十';
  }

  function lunarMonthName(month, leap) {
    return (leap ? '闰' : '') + LUNAR_MONTHS[month - 1] + '月';
  }

  /* ============ 节气 ============ */
  function dayOfYear(y, m, d) {
    return Math.floor((Date.UTC(y, m - 1, d) - Date.UTC(y, 0, 1)) / 86400000) + 1;
  }

  function termOf(y, m, d) {
    var line = TERM_DATA[y - YEAR_BASE];
    if (!line) return null;
    var map = termCache[y];
    if (!map) {
      map = Object.create(null);
      for (var i = 0; i < 24; i++) {
        map[parseInt(line.substr(i * 2, 2), 36)] = TERM_NAMES[i];
      }
      termCache[y] = map;
    }
    return map[dayOfYear(y, m, d)] || null;
  }

  /* ============ 节假日 ============ */
  var holidayMap = Object.create(null);

  function parseKey(key) {
    var p = key.split('-');
    return { y: Number(p[0]), m: Number(p[1]), d: Number(p[2]) };
  }
  function keyOf(y, m, d) {
    return y + '-' + (m < 10 ? '0' : '') + m + '-' + (d < 10 ? '0' : '') + d;
  }
  function addDays(date, n) {
    return new Date(date.getFullYear(), date.getMonth(), date.getDate() + n, 12);
  }

  (function buildHolidays() {
    HOLIDAY_RANGES.forEach(function (row) {
      var start = parseKey(row[0]);
      var end = parseKey(row[1]);
      var cur = new Date(start.y, start.m - 1, start.d, 12);
      var last = new Date(end.y, end.m - 1, end.d, 12);
      var first = true;
      while (cur <= last) {
        holidayMap[keyOf(cur.getFullYear(), cur.getMonth() + 1, cur.getDate())] = {
          name: row[2], type: 'off', first: first
        };
        first = false;
        cur = addDays(cur, 1);
      }
    });
    WORK_DAYS.forEach(function (row) {
      var p = parseKey(row[0]);
      holidayMap[row[0]] = { name: row[1], type: 'work', first: true, y: p.y, m: p.m, d: p.d };
    });
  })();

  function holidayOf(key) { return holidayMap[key] || null; }

  /* ============ 周与日期 ============ */
  function isoWeek(date) {
    var d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    var day = d.getUTCDay() || 7;

    return { year: d.getUTCFullYear(), week: week };
  }

  function mondayOf(date) {

  function diffDays(a, b) {

    var ub = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  // 按「第几个周几」确定的节日：五月第 2 个周日、六月第 3 个周日、十一月第 4 个周四
  function movingFest(y, m, d) {
    var wd = new Date(y, m - 1, d, 12).getDay();
    if (m === 5 && wd === 0 && d >= 8 && d <= 14) return '母亲节';
    if (m === 6 && wd === 0 && d >= 15 && d <= 21) return '父亲节';
    if (m === 11 && wd === 4 && d >= 22 && d <= 28) return '感恩节';
    return null;
  }

  function dayInfo(date) {
    var y = date.getFullYear();
    var m = date.getMonth() + 1;
    var d = date.getDate();
    var key = keyOf(y, m, d);
    if (infoCache[key]) return infoCache[key];

    var lunar = lunarFromDate(y, m, d);
    var term = termOf(y, m, d);
    var holiday = holidayOf(key);
    var festivals = [];

    if (lunar && !lunar.leap) {
      var lunarFest = LUNAR_FEST[lunar.month + '-' + lunar.day];
      if (lunarFest) festivals.push(lunarFest);
      if (lunar.month === 12 && lunar.day === lunar.daysInMonth) festivals.push('除夕');
    }
    var solarFest = SOLAR_FEST[pad2(m) + '-' + pad2(d)];
    if (solarFest) festivals.push(solarFest);
    var movedFest = movingFest(y, m, d);
    if (movedFest) festivals.push(movedFest);

    var festival = festivals.length ? festivals[0] : null;

    var info = {

    var data;
    try { data = JSON.parse(raw); } catch (e) { return; }
    if (!data || typeof data !== 'object') return;
    if (data.view === 'week' || data.view === 'month' || data.view === 'year') state.view = data.view;
    if (typeof data.date === 'string') {
      var p = parseKey(data.date);
      if (p.y >= MIN_YEAR && p.y <= MAX_YEAR) {

    var lunar = info.lunar;
    var line = lunar
      ? '农历' + lunarMonthName(lunar.month, lunar.leap) + lunarDayName(lunar.day)
      : '农历 —';
    if (lunar) {
      line += ' · ' + GAN[(lunar.year - 4) % 10] + ZHI[(lunar.year - 4) % 12] + ZODIAC[(lunar.year - 4) % 12] + '年';
    }
    el.dLunar.textContent = line;

    var chips = [];
    var wk = info.week;
    chips.push('<span class="chip">第 ' + wk.week + ' 周</span>');
    var star = starSign(info.m, info.d);
    chips.push('<span class="chip sign"><i>' + star[3] + '</i>' + star[2] + '</span>');
    if (info.term) chips.push('<span class="chip term">' + info.term + '</span>');
    if (info.holiday) {
      chips.push('<span class="chip ' + (info.holiday.type === 'off' ? 'off' : '') + '">' +
        info.holiday.name + (info.holiday.type === 'off' ? ' 休' : ' 班') + '</span>');
    } else if (info.festival) {
      chips.push('<span class="chip off">' + info.festival + '</span>');
    }

    var today = startOfDay(new Date());
    var delta = diffDays(state.date, today);
    chips.push('<span class="chip">' + (delta === 0 ? '今天' : (delta > 0 ? delta + ' 天后' : (-delta) + ' 天前')) + '</span>');

    el.dMeta.innerHTML = chips.join('');

    renderNote(info);
  }

  /* ============ 节气 / 假日说明 ============ */
  function termSeason(term) {
    var i = TERM_NAMES.indexOf(term);
    if (i < 0) return null;
    if (i >= 20) return { label: '冬', index: i - 19 };
    if (i < 2) return { label: '冬', index: i + 5 };
    return { label: ['春', '夏', '秋'][Math.floor((i - 2) / 6)], index: (i - 2) % 6 + 1 };
  }

  function fmtMD(p) { return p.m + ' 月 ' + p.d + ' 日'; }

  function holidayRange(info) {
    for (var i = 0; i < HOLIDAY_RANGES.length; i++) {
      var row = HOLIDAY_RANGES[i];
      if (info.key < row[0] || info.key > row[1]) continue;

      var s = parseKey(row[0]);
      var e = parseKey(row[1]);
      var sd = new Date(s.y, s.m - 1, s.d, 12);
      var ed = new Date(e.y, e.m - 1, e.d, 12);
      var base = row[2].indexOf('国庆') === 0 ? '国庆' : row[2];
      var work = [];

      WORK_DAYS.forEach(function (item) {
        if (item[1].indexOf(base) !== 0) return;
        var p = parseKey(item[0]);
        var wd = new Date(p.y, p.m - 1, p.d, 12);
        if (diffDays(wd, sd) < -15 || diffDays(wd, ed) > 15) return;
        work.push(fmtMD(p));
      });

      return { start: s, end: e, days: diffDays(ed, sd) + 1, work: work };
    }
    return null;
  }

  function setNote(open) {
    el.noteBody.hidden = !open;
    el.noteToggle.setAttribute('aria-expanded', String(open));
  }

  function renderNote(info) {
    var term = info.term;
    var festival = info.festival;
    var holiday = info.holiday && info.holiday.type === 'off' ? info.holiday : null;

    // 连续假期的其余日子按普通日处理：只有当天本身是节气或节日才展开说明
    if (!term && !festival) {
      el.note.hidden = true;
      return;
    }

    var range = holiday ? holidayRange(info) : null;
    var season = term ? termSeason(term) : null;
    var baseName = holiday && holiday.name.indexOf('国庆') === 0 ? '国庆节' : (holiday ? holiday.name : '');
    var festInfo = FEST_INFO[festival] || (holiday ? FEST_INFO[baseName] : null);

    el.note.hidden = state.view === 'year';

    var kinds = [];
    if (term) kinds.push('节气');
    if (festival) kinds.push('节日');
    if (holiday) kinds.push('假日');
    el.noteKind.textContent = kinds.join(' · ');
    el.noteKind.classList.toggle('is-fest', Boolean(holiday));
    el.noteKind.classList.toggle('is-day', !holiday && Boolean(festival));

    el.noteName.textContent = festival || term || holiday.name;

    var sum = [];
    if (festInfo && festInfo.tag) sum.push(festInfo.tag);
    if (season) sum.push(season.label + '季第 ' + season.index + ' 个节气');
    if (range) sum.push('放假 ' + range.days + ' 天');
    el.noteSum.textContent = sum.join(' · ');

    el.noteDesc.textContent = festInfo ? festInfo.desc
      : (term ? (TERM_DESC[term] || '') : (HOLIDAY_DESC[holiday.name] || ''));

    var lines = [];
    var custom = festInfo ? festInfo.custom : (term ? TERM_CUSTOM[term] : '');
    if (custom) lines.push('习俗：' + custom);
    if (range) {
      var line = '放假 ' + fmtMD(range.start) + ' – ' + fmtMD(range.end) + '，共 ' + range.days + ' 天';
      if (range.work.length) line += '；调休上班 ' + range.work.join('、');
      lines.push(line);
    }
    var others = (info.festivals || []).filter(function (name) {
      return name !== festival;
    });
    if (others.length) lines.push('同日还有「' + others.join('、') + '」');
    if (term && typeof TERM_LONGITUDE[term] === 'number') {
      lines.push('太阳到达黄经 ' + TERM_LONGITUDE[term] + '°');
    }
    el.noteExtra.innerHTML = lines.join('<br>');

    setNote(false);
  }

  function render() {
    el.viewWeek.hidden = state.view !== 'week';
    el.viewMonth.hidden = state.view !== 'month';
    el.viewYear.hidden = state.view !== 'year';
    el.detail.hidden = state.view === 'year';

    var pickable = state.view === 'year';
    el.title.classList.toggle('is-pick', pickable);
    el.title.tabIndex = pickable ? 0 : -1;
    if (pickable) el.title.setAttribute('role', 'button');
    else el.title.removeAttribute('role');

    Array.prototype.forEach.call(el.seg.querySelectorAll('button'), function (btn) {
      var on = btn.getAttribute('data-view') === state.view;
      btn.classList.toggle('is-on', on);
      btn.setAttribute('aria-pressed', String(on));
    });

    if (state.view === 'week') renderWeek();
    else if (state.view === 'month') renderMonth();
    else renderYear();

    renderDetail();
    save();
  }

  /* ============ 交互 ============ */
  function selectDate(key) {
    var p = parseKey(key);
    var dt = new Date(p.y, p.m - 1, p.d, 12);
    if (dt.getFullYear() < MIN_YEAR || dt.getFullYear() > MAX_YEAR) return;
    state.date = dt;
    render();
  }

  function shift(delta) {
    if (state.view === 'week') {
      state.date = addDays(state.date, 7 * delta);
    } else if (state.view === 'month') {
      var d = state.date.getDate();
      var target = new Date(state.date.getFullYear(), state.date.getMonth() + delta, 1, 12);
      var last = new Date(target.getFullYear(), target.getMonth() + 1, 0, 12).getDate();
      state.date = new Date(target.getFullYear(), target.getMonth(), Math.min(d, last), 12);
    } else {
      var y = state.date.getFullYear() + delta;
      var m = state.date.getMonth();
      var day = Math.min(state.date.getDate(), new Date(y, m + 1, 0, 12).getDate());
      state.date = new Date(y, m, day, 12);
    }
    if (state.date.getFullYear() < MIN_YEAR) state.date = new Date(MIN_YEAR, 0, 1, 12);
    if (state.date.getFullYear() > MAX_YEAR) state.date = new Date(MAX_YEAR, 11, 31, 12);
    render();
  }

  el.seg.addEventListener('click', function (event) {
    var btn = event.target.closest('button[data-view]');
    if (!btn) return;
    state.view = btn.getAttribute('data-view');
    render();
  });

  el.prev.addEventListener('click', function () { shift(-1); });
  el.next.addEventListener('click', function () { shift(1); });
  el.today.addEventListener('click', function () {
    state.date = startOfDay(new Date());
    render();
  });

  el.weekList.addEventListener('click', function (event) {
    var row = event.target.closest('[data-date]');
    if (!row) return;
    selectDate(row.getAttribute('data-date'));
  });

  el.monthGrid.addEventListener('click', function (event) {
    var cell = event.target.closest('[data-date]');
    if (!cell) return;
    var key = cell.getAttribute('data-date');
    var p = parseKey(key);
    if (p.m !== state.date.getMonth() + 1) {
      state.date = new Date(p.y, p.m - 1, p.d, 12);
      render();
      return;
    }
    selectDate(key);
  });

  el.yearGrid.addEventListener('click', function (event) {
    var day = event.target.closest('.mini [data-date]');
    if (day) {
      var p = parseKey(day.getAttribute('data-date'));
      state.view = 'month';
      state.date = new Date(p.y, p.m - 1, p.d, 12);
      render();
      return;
    }
    var head = event.target.closest('header[data-month]');
    if (head) {
      var m = Number(head.getAttribute('data-month'));
      state.view = 'month';
      state.date = new Date(state.date.getFullYear(), m - 1, 1, 12);
      render();
    }
  });

  el.noteToggle.addEventListener('click', function () {
    setNote(el.noteBody.hidden);
  });

  /* ---- 年份跳转 ---- */
  function openYearPicker() {
    el.yearInput.value = state.date.getFullYear();
    el.yearNote.textContent = '范围 ' + MIN_YEAR + '–' + MAX_YEAR;
    el.yearNote.classList.remove('is-error');
    syncYearQuick();
    if (typeof el.yearPicker.showModal === 'function') {
      if (!el.yearPicker.open) el.yearPicker.showModal();
    } else {
      el.yearPicker.setAttribute('open', '');
    }
    setTimeout(function () {
      el.yearInput.focus({ preventScroll: true });
      if (typeof el.yearInput.select === 'function') el.yearInput.select();
    }, 30);
  }

  function closeYearPicker() {
    if (typeof el.yearPicker.close === 'function') el.yearPicker.close();
    else el.yearPicker.removeAttribute('open');
  }

  function syncYearQuick() {
    var value = String(el.yearInput.value || '').trim();
    Array.prototype.forEach.call(el.yearQuick.querySelectorAll('button[data-year]'), function (btn) {
      btn.classList.toggle('is-on', btn.getAttribute('data-year') === value);
    });
  }

  function applyYear() {
    var raw = String(el.yearInput.value || '').trim();
    var y = Number(raw);
    if (!raw || !isFinite(y) || Math.floor(y) !== y || y < MIN_YEAR || y > MAX_YEAR) {
      el.yearNote.textContent = '请输入 ' + MIN_YEAR + '–' + MAX_YEAR + ' 之间的整数年份';
      el.yearNote.classList.add('is-error');
      el.yearInput.focus({ preventScroll: true });
      el.yearInput.select();
      return false;
    }
    el.yearNote.classList.remove('is-error');
    var m = state.date.getMonth();
    var d = Math.min(state.date.getDate(), new Date(y, m + 1, 0, 12).getDate());
    state.date = new Date(y, m, d, 12);
    render();
    return true;
  }

  el.title.addEventListener('click', function () {
    if (state.view !== 'year') return;
    openYearPicker();
  });

  el.title.addEventListener('keydown', function (event) {
    if (state.view !== 'year') return;
    if (event.key === 'Enter' || event.key === ' ' || event.key === 'Spacebar') {
      event.preventDefault();
      openYearPicker();
    }
  });

  el.yearForm.addEventListener('submit', function (event) {
    event.preventDefault();
    if (applyYear()) closeYearPicker();
  });

  el.yearCancel.addEventListener('click', closeYearPicker);

  el.yearQuick.addEventListener('click', function (event) {
    var chip = event.target.closest('button[data-year]');
    if (!chip) return;
    el.yearInput.value = chip.getAttribute('data-year');
    el.yearNote.textContent = '范围 ' + MIN_YEAR + '–' + MAX_YEAR;
    el.yearNote.classList.remove('is-error');
    syncYearQuick();
    el.yearInput.focus({ preventScroll: true });
  });

  el.yearInput.addEventListener('input', function () {
    el.yearNote.textContent = '范围 ' + MIN_YEAR + '–' + MAX_YEAR;
    el.yearNote.classList.remove('is-error');
    syncYearQuick();
  });

  el.yearPicker.addEventListener('click', function (event) {
    if (event.target === el.yearPicker) closeYearPicker();
  });

  document.addEventListener('keydown', function (event) {
    if (el.yearPicker.hasAttribute('open')) return;
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.key === 'ArrowLeft') { event.preventDefault(); shift(-1); }
    else if (event.key === 'ArrowRight') { event.preventDefault(); shift(1); }
    else if (event.key === 't' || event.key === 'T') {
      state.date = startOfDay(new Date());
      render();
    }
  });

  restore();
  render();
})();
</script>
</body>
</html>
